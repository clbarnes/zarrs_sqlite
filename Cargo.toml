[package]
name = "zarrs_sqlite"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
futures = "0.3.33"
jiff = { version = "0.2.35", default-features = false, features = [
    "std",
    "alloc",
    "perf-inline",
] }
log = "0.4.33"
thiserror = "2.0.19"
tokio = { version = "1.0", features = ["full"], optional = true }
turso = { version = "0.7.1", optional = true }
zarrs_storage = { version = "0.4.5", features = ["async"] }

[features]
default = ["backend-turso"]
backend-turso = ["dep:turso", "dep:tokio"]

[dev-dependencies]
criterion = "0.8.2"
env_logger = "0.11.11"
temp_testdir = "0.2.3"
zarrs = { version = "0.23.13", default-features = false, features = ["async"] }
